name: PR risk

# pull_request_target so fork PRs get labelled too. This is safe here because the job
# checks out the BASE branch (the default for this event) and the scorer only reads the
# PR through the API; it never checks out or runs code from the PR.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: risk
        uses: ./pr-risk
      - run: echo "Risk level is ${{ steps.risk.outputs.level }} (score ${{ steps.risk.outputs.score }})"
